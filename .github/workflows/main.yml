name: 🛠 Android CI / Build & Release APK

on:
  push:
    branches: [ main, master, upgrade ]
    tags:    [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master, upgrade ]

permissions:
  contents: read    # only the release job below can write
  actions:  read    # allow pulling marketplace actions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v6

      - name: 🚀 Cache pub deps
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 📥 Get dependencies
        run: flutter pub get

      - name: 🔍 Analyze code
        run: flutter analyze

      - name: ✅ Run tests
        run: flutter test --coverage

  build_apk:
    needs: build_and_release          # only after analyze + tests pass
    if: github.event_name == 'push'   # merges to main and v* tags, never PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write                  # delete older APKs

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v6

      - name: ☕️ Setup Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 🏗️ Build APK
        run: flutter build apk --release

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release.apk   # must match the file name so overwrite finds it
          path: build/app/outputs/flutter-apk/app-release.apk
          archive: false          # download the .apk itself, not a zip
          retention-days: 14
          if-no-files-found: error
          overwrite: true         # a re-run replaces its own APK

      - name: 🧹 Delete older APKs
        # Keep one APK per branch or tag. Each is about 53 MB, and GitHub Free
        # includes only 500 MB of artifact storage for private repos.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=app-release.apk" \
            --jq '.artifacts[]
              | select((.expired | not)
                and .workflow_run.head_branch == env.GITHUB_REF_NAME
                and .workflow_run.id != (env.GITHUB_RUN_ID | tonumber))
              | .id')
          for id in $old; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done

  release:
    needs: build_apk                  # reuses the APK that job uploaded
    if: startsWith(github.ref, 'refs/tags/v')   # v* tags only, never main
    runs-on: ubuntu-latest
    permissions:
      contents: write                 # create the GitHub Release

    steps:
      - name: 📥 Download APK
        uses: actions/download-artifact@v8
        with:
          name: app-release.apk       # saved as-is, because it was uploaded unzipped

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Android build of Cozy Sidekick ${{ github.ref_name }}. Download `app-release.apk` below and open it on your phone.

            Each build is signed with a different debug key, so uninstall any earlier Cozy Sidekick build first. Uninstalling deletes its saved keys and chats.
