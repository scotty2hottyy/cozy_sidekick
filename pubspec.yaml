name: cozy_sidekick
description: "A cozy AI chat app for iOS and Android. Bring your own AI provider and choose your sidekick's personality."
# Not a package, so never publish it to pub.dev.
publish_to: 'none'

# version: <build-name>+<build-number>. Android uses them as versionName and
# versionCode, and iOS as CFBundleShortVersionString and CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  http: ^1.5.0
  shared_preferences: ^2.5.3
  speech_to_text: ^7.4.0
  gpt_markdown: 1.3.0
  flutter_math_fork: ^0.7.4
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Lint rules are turned on in analysis_options.yaml.
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
